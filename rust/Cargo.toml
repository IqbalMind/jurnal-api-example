[package]
name = "jurnal-api-rust"
version = "1.0.0"
edition = "2021"
description = "Mekari Jurnal Open API client with HMAC-SHA256 authentication in Rust"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.37", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
